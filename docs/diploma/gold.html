<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Золотой диплом дружбы</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=Great+Vibes&family=Cormorant+Garamond:wght@400;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: radial-gradient(ellipse at 50% 30%, #2d1050 0%, #1a0a30 40%, #0a0018 70%, #050010 100%);
            min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 12px; gap: 14px; overflow: hidden;
        }
        /* Падающие эмодзи */
        .falling { position: fixed; top: -60px; animation: fall linear infinite; pointer-events: none; z-index: 0; font-size: 24px; }
        @keyframes fall {
            0% { transform: translateY(-60px) rotate(0deg); opacity: 0; }
            5% { opacity: 1; }
            85% { opacity: 1; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
        }
        .diploma {
            position: relative; z-index: 1;
            width: 100%; max-width: 340px; 
        }
        /* Овальная рамка */
        .oval-frame {
            background: linear-gradient(180deg, #fef8e8 0%, #fdf2d0 15%, #fce8b2 40%, #ffefd5 60%, #fce8b2 85%, #fef8e8 100%);
            border-radius: 50% / 8%;
            padding: 6px;
            box-shadow: 0 0 40px rgba(212,168,67,0.4), 0 0 80px rgba(212,168,67,0.2), inset 0 0 40px rgba(212,168,67,0.05);
            position: relative;
        }
        .gold-border {
            background: linear-gradient(135deg, #8b6914, #d4a843, #ffd700, #d4a843, #8b6914, #d4a843, #ffd700);
            background-size: 300% 300%;
            animation: borderShine 4s linear infinite;
            border-radius: 50% / 8%;
            padding: 3px;
        }
        @keyframes borderShine {
            0% { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }
        .inner {
            background: linear-gradient(180deg, #fef8e8, #fdf2d0 20%, #fce8b2 50%, #fdf2d0 80%, #fef8e8);
            border-radius: 50% / 8%;
            padding: 25px 20px 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        /* Блёстки внутри */
        .sparkle {
            position: absolute; width: 4px; height: 4px;
            background: #ffd700; border-radius: 50%;
            animation: sparkle 2.5s ease-in-out infinite;
            box-shadow: 0 0 6px #ffd700;
        }
        @keyframes sparkle {
            0%,100% { opacity: 0.2; transform: translateY(0) scale(1); }
            50% { opacity: 1; transform: translateY(-14px) scale(1.5); }
        }
        .crown { font-size: 50px; animation: bounce 2s ease-in-out infinite; display: block; }
        @keyframes bounce { 0%,100% { transform: translateY(0); } 35% { transform: translateY(-10px); } }
        .badge { background: linear-gradient(135deg, #ffd700, #d4a843); color: #2a1000; padding: 5px 14px; border-radius: 20px; font-size: 10px; font-weight: 700; letter-spacing: 3px; display: inline-block; margin: 6px 0; font-family: 'Cormorant Garamond', serif; }
        .title { font-family: 'Great Vibes', cursive; font-size: 42px; color: #5c3d00; margin: 2px 0; line-height: 1; }
        .subtitle { font-size: 13px; color: #8b6914; letter-spacing: 5px; text-transform: uppercase; font-weight: 700; margin-bottom: 4px; }
        .ornament { font-size: 10px; color: #d4a843; letter-spacing: 4px; margin: 4px 0; }
        .phrase { font-size: 16px; color: #6b4d00; margin: 3px 0; font-style: italic; font-family: 'Cormorant Garamond', serif; }
        .recipient { font-family: 'Great Vibes', cursive; font-size: 46px; color: #3d1a00; margin: 4px 0; line-height: 1.1; }
        .creator-name { font-family: 'Great Vibes', cursive; font-size: 36px; color: #5c3d00; margin: 2px 0; line-height: 1.1; }
        .score-big { font-family: 'Playfair Display', serif; font-size: 60px; color: #3d1a00; font-weight: 900; margin: 2px 0; line-height: 1; }
        .percent { font-size: 28px; }
        .hearts-row { font-size: 20px; margin: 4px 0; animation: heartBeat 2s ease-in-out infinite; }
        @keyframes heartBeat { 0%,100% { transform: scale(1); } 15% { transform: scale(1.1); } 30% { transform: scale(1); } }
        .status-text { font-size: 20px; color: #5c3d00; font-weight: 700; margin: 4px 0; }
        .prediction { font-size: 16px; color: #6b4d00; margin: 8px 0; font-style: italic; line-height: 1.4; padding: 0 6px; }
        .footer-text { font-size: 11px; color: #a08040; margin-top: 8px; letter-spacing: 3px; }
        .share-btn { 
            position: relative; z-index: 1;
            background: linear-gradient(135deg, #1a0800, #3d1a00, #1a0800); 
            color: #ffd700; border: 2px solid #d4a843; 
            padding: 16px 28px; border-radius: 30px;
            font-family: 'Cormorant Garamond', serif;
            font-size: 20px; font-weight: 700; letter-spacing: 2px; 
            cursor: pointer; width: 100%; max-width: 340px; 
            text-transform: uppercase;
            box-shadow: 0 0 30px rgba(255,215,0,0.3);
            animation: btnGlow 2s ease-in-out infinite;
        }
        @keyframes btnGlow { 0%,100% { box-shadow: 0 0 30px rgba(255,215,0,0.3); } 50% { box-shadow: 0 0 50px rgba(255,215,0,0.6); } }
        .share-btn:active { transform: scale(0.96); }
    </style>
</head>
<body>
    <div class="diploma" id="diploma">
        <div class="oval-frame">
            <div class="gold-border">
                <div class="inner">
                    <div class="crown">👑</div>
                    <div class="badge">✦ ROYAL ✦</div>
                    <div class="title">Золотой диплом</div>
                    <div class="subtitle">дружбы</div>
                    <div class="ornament">◈ ⬩ ⬩ ◈</div>
                    <div class="phrase">Настоящим подтверждается, что</div>
                    <div class="recipient" id="recipient">Анна</div>
                    <div class="phrase">знает</div>
                    <div class="creator-name" id="creatorName">Марию</div>
                    <div class="phrase">на</div>
                    <div class="score-big" id="scoreBig">85<span class="percent">%</span></div>
                    <div class="hearts-row" id="hearts">💖💖💖💖💖💖💖💖🤍🤍</div>
                    <div class="status-text" id="status">ЛУЧШИЕ ПОДРУГИ! 💎</div>
                    <div class="ornament">◈ ⬩ ⬩ ◈</div>
                    <div class="prediction" id="prediction">✨ Ваша дружба — настоящее сокровище! ✨</div>
                    <div class="footer-text">🌙 @PodrugaTestBot</div>
                </div>
            </div>
        </div>
    </div>
    <button class="share-btn" onclick="shareDiploma()">✦ Поделиться ✦</button>
    
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script>
        // Параметры
        const p = new URLSearchParams(window.location.search);
        document.getElementById('recipient').textContent = decodeURIComponent(p.get('name') || 'Подруга');
        document.getElementById('creatorName').textContent = decodeURIComponent(p.get('creator') || 'Подругу');
        const s = parseInt(p.get('score') || '85');
        document.getElementById('scoreBig').innerHTML = s + '<span class="percent">%</span>';
        document.getElementById('hearts').textContent = '💖'.repeat(Math.floor(s/10)) + '🤍'.repeat(10-Math.floor(s/10));
        document.getElementById('status').textContent = decodeURIComponent(p.get('status') || 'ЛУЧШИЕ ПОДРУГИ!');
        document.getElementById('prediction').textContent = decodeURIComponent(p.get('prediction') || '✨ Ваша дружба — настоящее сокровище!');
        
        // Падающие эмодзи
        const emojis = ['👑','💛','✨','🌟','💫','⭐','💎','🦁','👸','🎀','💝','🥇'];
        for (let i=0; i<30; i++) {
            const e = document.createElement('div');
            e.className = 'falling';
            e.textContent = emojis[Math.floor(Math.random()*emojis.length)];
            e.style.left = Math.random()*100+'%';
            e.style.animationDuration = (6+Math.random()*14)+'s';
            e.style.animationDelay = Math.random()*12+'s';
            e.style.fontSize = (16+Math.random()*28)+'px';
            document.body.appendChild(e);
        }
        
        // Блёстки внутри
        const inner = document.querySelector('.inner');
        for (let i=0; i<20; i++) {
            const s = document.createElement('div');
            s.className = 'sparkle';
            s.style.left = Math.random()*90+'%';
            s.style.top = Math.random()*85+'%';
            s.style.animationDelay = Math.random()*3+'s';
            inner.appendChild(s);
        }
        
        async function shareDiploma() {
            const c = await html2canvas(document.getElementById('diploma'), { scale: 2, backgroundColor: '#0a0018' });
            const b = await new Promise(r => c.toBlob(r, 'image/png'));
            const f = new File([b], 'zolotoy-diplom.png', { type: 'image/png' });
            if (navigator.canShare && navigator.canShare({ files: [f] })) {
                await navigator.share({ files: [f], title: 'Мой золотой диплом дружбы!', text: 'Пройди тест и получи свой! @PodrugaTestBot' });
            } else {
                const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'zolotoy-diplom.png'; a.click();
            }
        }
    </script>
</body>
</html>
